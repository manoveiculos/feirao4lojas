name: Sincronizar Estoque ACELERA V3

on:
  schedule:
    # Roda automaticamente 3x por dia (horário de Brasília, UTC-3):
    # 07:00 BRT (10:00 UTC), 12:00 BRT (15:00 UTC) e 17:00 BRT (20:00 UTC)
    - cron: '0 10,15,20 * * *'
  workflow_dispatch:
    # Permite clicar em "Run workflow" no GitHub para atualizar na hora

permissions:
  contents: write

concurrency:
  group: sync-estoque
  cancel-in-progress: false

jobs:
  sync:
    name: Extrair carros novos e remover vendidos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar estoque das 4 lojas
        run: npm run sync

      - name: Verificar alterações e publicar automaticamente
        run: |
          if git diff --quiet data/estoque.json; then
            echo "✅ Nenhuma alteração no estoque das 4 lojas. Nenhum commit necessário."
            exit 0
          fi

          git config user.name "Acelera V3 Bot"
          git config user.email "bot@acelerav3.local"
          git add data/estoque.json
          DATE_BRT=$(TZ="America/Sao_Paulo" date "+%d/%m/%Y %H:%M")
          git commit -m "chore(estoque): atualização automática das 4 lojas (${DATE_BRT} BRT)"
          git push origin HEAD:main
          echo "🚀 Estoque atualizado e enviado para main!"
